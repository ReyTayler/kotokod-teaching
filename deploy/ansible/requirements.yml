# Коллекции модулей Ansible. Ставит scripts/bootstrap-ansible.sh.
# Версии закреплены точно: плейбук должен вести себя одинаково и сегодня,
# и в день аварии через год.

collections:
  # Роли и базы PostgreSQL (роль postgresql). 4.2.0, а не свежая 5.0.0:
  # мажорная версия вышла в сентябре 2026, 4.x проверена временем.
  - name: community.postgresql
    version: "4.2.0"
