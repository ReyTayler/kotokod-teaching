# Главный плейбук: каким должен быть сервер журнала.
#
# Запуск (на сервере, из папки deploy/ansible) — шпаргалка в README.md рядом:
#   /opt/ansible/bin/ansible-playbook site.yml --check --diff   # только показать отличия
#   /opt/ansible/bin/ansible-playbook site.yml                  # привести сервер к описанию
#   ... site.yml -e restore=true                 # новый сервер из копий S3 (авария)
#   ... site.yml -e restore=true -e drill=true   # учения на временном сервере

- name: Сервер журнала KOTOKOD
  hosts: journal
  become: true

  # .env нужен уже роли postgresql (DATABASE_URL), поэтому проверяется до
  # всех ролей — с понятной подсказкой вместо ошибки разбора в середине прогона.
  pre_tasks:
    - name: Проверить .env
      ansible.builtin.stat:
        path: "{{ app_root }}/.env"
      register: app_env

    - name: .env обязателен
      ansible.builtin.assert:
        that: app_env.stat.exists
        fail_msg: >-
          Нет {{ app_root }}/.env. Это секрет и плейбук его не создаёт: положите
          файл из менеджера паролей (запись «KOTOKOD прод .env») и запустите снова.
        quiet: true

  roles:
    - base
    - security
    - postgresql
    - redis
    # До app: миграции и сервисы должны подняться уже на восстановленной базе.
    - role: restore
      when: restore | bool
    - app
    - services
    # На учениях обеих ролей нет: копии и архив WAL писали бы в бакет прода,
    # а сертификата боевого домена на временном сервере нет.
    #
    # backup — РАНЬШЕ nginx: при аварии первый прогон останавливается на
    # nginx (сертификата ещё нет, домен смотрит на старый сервер), а копии
    # к этому моменту уже должны работать.
    - role: backup
      when: not drill | bool
    - role: nginx
      when: not drill | bool
