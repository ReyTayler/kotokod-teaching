# Настройки Ansible для журнала. Ansible читает этот файл, если запускать его
# из папки deploy/ansible (cd deploy/ansible && ansible-playbook site.yml).

[defaults]
inventory = inventory.yml
roles_path = roles
# Коллекции ставятся рядом с самим Ansible (scripts/bootstrap-ansible.sh),
# не в домашнюю папку root — так версия коллекций закреплена вместе с ядром.
collections_path = /opt/ansible/collections
# Результаты задач в YAML, а не в одну строку JSON — читаемо человеком.
# Встроенная возможность ядра, отдельная коллекция не нужна.
callback_result_format = yaml
# Не спрашивать про ключ хоста: плейбук работает на самой машине (connection: local).
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
