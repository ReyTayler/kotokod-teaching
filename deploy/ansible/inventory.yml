# Список серверов. Плейбук запускается НА самом сервере (ssh на VPS → команда),
# поэтому сервер один — «эта машина», без SSH-подключения к самой себе.
# Так при аварии не нужно ничего, кроме SSH-доступа к новому VPS: ни WSL,
# ни Ansible на компьютере владельца.

all:
  hosts:
    journal:
      ansible_connection: local
