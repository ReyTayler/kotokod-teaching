# Непрерывный архив WAL в pgBackRest — основа восстановления на любую минуту.
#
# Установка: sudo cp deploy/pgbackrest/postgresql-archive.conf \
#              /etc/postgresql/15/main/conf.d/pgbackrest.conf
# archive_mode меняется только РЕСТАРТОМ PostgreSQL (секунды простоя),
# reload не хватит.

archive_mode = on
archive_command = 'pgbackrest --stanza=journal archive-push %p'

# Принудительно закрывать WAL-сегмент раз в минуту, даже если записей мало.
# Это верхняя граница потери данных при гибели сервера. Если записей не было,
# PostgreSQL сегмент не переключает, так что ночью архив не растёт; досрочно
# закрытые сегменты имеют полный размер (16 МБ), но в S3 уходят сжатыми.
# Меньше минуты не ставить: документация PostgreSQL предупреждает, что очень
# короткий archive_timeout раздувает архив. Секунды — только потоковой
# репликацией на второй сервер.
archive_timeout = 60
