# pgBackRest — резервные копии PostgreSQL вне Beget (Selectel S3, Москва).
#
# Зачем: ночной pg_dump (deploy/scripts/backup-db.sh) лежит на том же VPS и
# погибнет вместе с ним. Здесь — копии в другом городе плюс непрерывный архив
# WAL, то есть восстановление на любую минуту, а не только на 03:00.
#
# Секретов в этом файле НЕТ: S3-ключи и пароль шифрования лежат в
# /etc/pgbackrest/conf.d/secrets.conf (pgBackRest подхватывает conf.d сам,
# config-include-path по умолчанию). Создаётся вручную, см.
# deploy/offsite-backup.md, шаг «Секреты».
#
# Установка: sudo cp deploy/pgbackrest/pgbackrest.conf /etc/pgbackrest/pgbackrest.conf

[global]
repo1-type=s3
repo1-s3-endpoint=s3.ru-6.storage.selcloud.ru
# У Selectel регион подписи = имя пула.
repo1-s3-region=ru-6
repo1-s3-bucket=kotokod-backoffice-reserve
# Шаблон Selectel не подставляет бакет в домен — адресация по пути.
repo1-s3-uri-style=path
repo1-path=/pgbackrest

# Шифрование на стороне сервера ДО отправки. Пароль — в secrets.conf.
# Потерять его = потерять все копии: дубль в менеджере паролей обязателен.
repo1-cipher-type=aes-256-cbc

# Хранение: 4 полных копии (раз в неделю, см. таймеры) ≈ месяц истории.
# WAL старше самой старой полной копии pgBackRest удаляет сам.
repo1-retention-full-type=count
repo1-retention-full=4

compress-type=zst
# Узкое место — не CPU, а ответ Selectel на запись (~2 с на файл при сети
# 10 мс): первая полная копия при process-max=2 шла 34 минуты, CPU простаивал.
# Процессы почти всё время ждут сеть, так что 4 потока ядрам не мешают.
process-max=4
start-fast=y

log-level-console=info
log-level-file=detail

[journal]
pg1-path=/var/lib/postgresql/15/main
